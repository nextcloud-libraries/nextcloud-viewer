# The e2e suite that runs against a real Nextcloud (e2e-server/), next to
# the playground one in playwright.yml. It is the only place the library
# meets the server's actual previews, capabilities and dav properties, so it
# also runs every night against the server's master: a change on that side
# breaks this even when nothing here moved.
name: Playwright Tests (real server)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      nextcloud-branch:
        description: Server branch to run against
        default: master
        required: false

permissions:
  contents: read

concurrency:
  group: playwright-server-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright-server:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Read package.json
      uses: nextcloud-libraries/parse-package-engines-action@122ae05d4257008180a514e1ddeb0c1b9d094bdd # v0.1.0
      id: versions

    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.versions.outputs.node-version }}

    - name: Set up npm
      run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

    - name: Install dependencies
      run: npm ci

    # The harness app loads the built package, not the sources
    - name: Build the library and the harness app
      run: npm run build:e2e-app

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests against a real server
      env:
        NEXTCLOUD_BRANCH: ${{ inputs.nextcloud-branch || 'master' }}
      run: npm run test:e2e:server -- --reporter=github,html

    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-server-report--attempt-${{ github.run_attempt }}
        path: playwright-report
        retention-days: 7

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [playwright-server]

    if: always()

    name: playwright-server-summary

    steps:
      - name: Summary status
        run: if ${{ needs.playwright-server.result != 'success' }}; then exit 1; fi
